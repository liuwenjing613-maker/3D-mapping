<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>两批种子 · 同实例分组</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff3f4;color:#21343e;font:14px "Segoe UI","Microsoft YaHei",sans-serif}header{background:white;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button{font:inherit;color:inherit;border:1px solid #cad8dc;background:white;border-radius:6px;padding:8px;cursor:pointer}a{color:#126f68}main{max-width:1500px;margin:auto;padding:14px}.note{color:#607680;font-size:12px;line-height:1.7}.layout{display:grid;grid-template-columns:260px 1fr;gap:14px}nav{max-height:76vh;overflow:auto;display:flex;flex-direction:column;gap:7px}nav button{text-align:left;line-height:1.7}nav button.active{border:2px solid #16837b;background:#e8f5f1}nav small{display:block;color:#607680}.panel{background:white;padding:15px;border-radius:8px;min-width:0}h2{font-size:17px;margin:0 0 10px}.members{display:grid;grid-template-columns:1fr 1fr;gap:14px}.member{border:1px solid #d4e0e3;border-radius:8px;overflow:hidden}.member img{width:100%;height:310px;object-fit:contain;background:#eaf0f2}.caption{padding:10px;line-height:1.8;font-size:13px}.tag{color:#126f68;font-weight:bold}.empty{padding:35px;color:#72858d;border:1px dashed #cbd8db;border-radius:8px}#evidence{font-size:13px;line-height:1.8;margin:12px 0}#error{color:#b13c2c}@media(max-width:850px){.layout{grid-template-columns:1fr}nav{max-height:180px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.member img{height:210px}}@media(max-width:480px){.members{grid-template-columns:1fr}}
</style><header><h1>两批种子 · 同实例分组</h1><select id="scene" aria-label="场景"><option>room0</option><option>office2</option></select><select id="filter" aria-label="分组类型"><option value="all">全部分组</option><option value="mixed">两批匹配组</option><option value="single">单独保留组</option></select><a href="./">返回种子筛选</a><a href="replica8/">八场景最终种子</a></header><main><div id="summary"></div><p class="note">普通 3D IoU &gt; 0.25；支持点最多者为固定主种子，只与主种子比较，不做链式合并。展示全部最终 Mask，分组不删除 Mask、不修改地图。</p><div id="error"></div><div class="layout"><nav id="groups"></nav><section class="panel" id="detail"><h2 id="title"></h2><div class="members" id="members"></div><div id="evidence"></div></section></div></main><script>
const $=id=>document.getElementById(id);let data,selected;
const sourceName=r=>r.source==='original'?'原本':'本次';
function show(g){selected=g.id;$('title').textContent=g.id+' · '+(g.mixed?'两批匹配':'单独保留')+' · '+g.members.length+' 张 Mask';$('members').replaceChildren();$('evidence').replaceChildren();
for(const source of ['original','current']){let col=document.createElement('div'),head=document.createElement('h2');head.textContent=source==='original'?'原本最终种子':'本次最终种子';col.append(head);let members=g.members.filter(r=>r.source===source);for(const r of members){let card=document.createElement('div');card.className='member';let im=document.createElement('img');im.src=r.image;im.alt=sourceName(r)+' '+r.label+' Mask';let cap=document.createElement('div');cap.className='caption';let title=document.createElement('b');title.className='tag';title.textContent=r.label+' · '+(r.primary?'本组主种子':'同组成员');let desc=document.createElement('div');desc.textContent='帧 '+r.frame+' · '+r.semantic+' · '+r.support.toLocaleString()+' 支持点';cap.append(title,desc);if(r.evidence){let ev=document.createElement('div');ev.textContent='与主种子 IoU = '+r.evidence.iou.toFixed(4)+'（> 0.25）';cap.append(ev)}card.append(im,cap);col.append(card)}if(!members.length){let empty=document.createElement('div');empty.className='empty';empty.textContent='本组没有'+(source==='original'?'原本':'本次')+'种子';col.append(empty)}$('members').append(col)}
for(const r of g.members.filter(r=>r.evidence)){let p=document.createElement('div');p.textContent=sourceName(r)+' '+r.label+' 与主种子：交集 '+r.evidence.intersection.toLocaleString()+' 点 / 并集 '+r.evidence.union.toLocaleString()+' 点 = '+r.evidence.iou.toFixed(4);$('evidence').append(p)}
if(g.members.length===1)$('evidence').textContent='按固定主种子规则单独保留；未归入其他主种子的组。';
for(const b of $('groups').children)b.classList.toggle('active',b.dataset.id===g.id);history.replaceState(null,'','#scene='+g.scene+'&group='+g.id+'&filter='+$('filter').value)}
function render(){const scene=$('scene').value,s=data.scenes[scene],filter=$('filter').value;let groups=data.groups.filter(g=>g.scene===scene&&(filter==='all'||(filter==='mixed'?g.mixed:!g.mixed)));$('summary').textContent='原本 '+s.original+' + 本次 '+s.current+' 张 → '+s.groups+' 组；其中 '+s.mixed+' 组两批匹配，'+s.singletons+' 组单独保留。';$('groups').replaceChildren();for(const g of groups){let b=document.createElement('button');b.dataset.id=g.id;let title=document.createElement('b');title.textContent=g.id+' · '+(g.mixed?'两批匹配':'单独保留');let desc=document.createElement('small');desc.textContent=g.members.map(r=>sourceName(r)+' '+r.label).join(' / ');b.append(title,desc);b.onclick=()=>show(g);$('groups').append(b)}$('detail').hidden=!groups.length;if(groups.length)show(groups.find(g=>g.id===selected)||groups[0])}
$('scene').onchange=()=>{selected=null;render()};$('filter').onchange=render;
fetch('combined.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{data=d;const h=new URLSearchParams(location.hash.slice(1));if(d.scenes[h.get('scene')])$('scene').value=h.get('scene');if(['all','mixed','single'].includes(h.get('filter')))$('filter').value=h.get('filter');selected=h.get('group');render()}).catch(e=>$('error').textContent='加载失败：'+e.message);
</script></html>
