<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>稳定簇 · 种子筛选过程</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;font:14px "Segoe UI","Microsoft YaHei",sans-serif;background:#eff3f4;color:#21343e}header{background:white;padding:13px 18px;display:flex;gap:14px;align-items:center;border-bottom:1px solid #d5e0e3;flex-wrap:wrap}h1{font-size:18px;margin:0}button,select,input{font:inherit;padding:7px 10px;border:1px solid #c9d7db;background:white;border-radius:6px;color:inherit}button,select{cursor:pointer}button.active{background:#126f68;color:white;border-color:#126f68}a{color:#126f68}main{max-width:1600px;margin:auto;padding:14px 18px}.note{font-size:12px;color:#607680;line-height:1.7;margin:0 0 12px}.steps{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.step{min-width:105px;text-align:left;flex-shrink:0}.step b{font-size:19px;display:block;margin:6px 0}.step small{font-size:11px;opacity:.8}.bar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:10px 0 12px}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:16px}.grid{grid-auto-rows:200px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:9px;align-content:start;max-height:68vh;overflow:auto;padding:2px}.card{padding:0;overflow:hidden;text-align:left;background:white}.card.selected{outline:2px solid #16837b}.card img{width:100%;height:135px;object-fit:contain;background:#e7edf0;display:block}.caption{padding:8px;line-height:1.7;font-size:12px}.caption strong{display:block;font-size:13px}.panel{background:white;border:1px solid #d3dfe3;border-radius:9px;padding:12px;min-width:0;max-height:75vh;overflow:auto}h2{font-size:15px;margin:0 0 8px}#large{width:100%;height:290px;object-fit:contain;background:#eaf0f2}#meta{font-size:12px;line-height:1.8;color:#58717b;margin:7px 0}table{border-collapse:collapse;width:100%;font-size:12px}td{padding:7px 5px;border-bottom:1px solid #e4ebed;vertical-align:top;line-height:1.6}td:first-child{white-space:nowrap}.pass{color:#157663}.fail{color:#b25627}.empty{padding:30px;color:#71868f}#count{font-size:12px;color:#617782}#search{max-width:180px}.small{font-size:12px}.final{color:#126f68}details{font-size:11px;color:#637982;margin-top:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#error{color:#ab352d}
@media(max-width:900px){.layout{grid-template-columns:1fr}.grid{grid-auto-rows:180px;max-height:40vh;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.panel{max-height:none}#large{height:230px}main{padding:10px}.step{min-width:96px}.card img{height:110px}header{padding:10px}}
</style><header><h1>修复种子检查</h1><select id="source" aria-label="种子来源"><option value="current">本次筛选过程</option><option value="original">原本最终种子</option></select><select id="scene" aria-label="场景"><option>room0</option><option>office2</option></select><span id="total"></span><a href="/clusters/" class="small">全部簇</a><a href="grouped.html" class="small">两批同实例分组</a><a href="replica8/">八场景最终种子</a></header><main><p class="note" id="note">每个稳定簇取支持点数最多的一张原始 Mask；并列取较早帧。先选后筛，淘汰不补选。下列数量为每一步剩余的主种子。</p><div class="steps" id="steps"></div><div class="bar"><select id="stageSelect" aria-label="筛选环节"></select><button id="kept" class="active">本步保留</button><button id="removed">本步淘汰</button><span id="count"></span><input id="search" aria-label="搜索簇或帧号" placeholder="搜索簇 / 帧号"></div><div id="error"></div><div class="layout"><div class="grid" id="grid"></div><section class="panel" id="detail" hidden><h2 id="title"></h2><img id="large" alt="选中的原始种子 Mask"><div id="meta"></div><a id="cluster">查看该簇全部成员 ↗</a><div id="abcEvidence"></div><table><tbody id="history"></tbody></table><details><summary>原始数值证据</summary><pre id="raw"></pre></details></section></div></main><script>
const $=id=>document.getElementById(id),names={};let data,stage='abc',removed=false,selected=null;
function evidence(r,h){const e=h.evidence||{};switch(h.stage){
case'chosen':return '帧 '+r.frame+' · Mask '+r.mask_local_id+' · 选取支持 '+r.selection_support.toLocaleString()+' 点';
case'boundary':return h.kept?'未触原图或裁剪边界':'触边：'+Object.entries(e.frame_edge_pixels||{}).filter(x=>x[1]>0).map(x=>({left:'左',right:'右',top:'上',bottom:'下'}[x[0]]+' '+x[1]+' 像素')).join('、');
case'noise':return h.kept?'通过原噪声规则':({AREA_LT_100:'面积不足 100 像素',THIN_EDGE_BAND:'细边带',SPARSE_EDGE_OUTLINE:'稀疏轮廓',LARGE_SPARSE_EDGE_OUTLINE:'大范围稀疏轮廓'}[e.reason]||e.reason);
case'grouping':return h.kept?'固定主种子':'归入 '+e.primary_track+'，本张作为辅助，不作为主种子';
case'semantic':return (r.semantic?r.semantic.top_class+'；':'')+'高置信背景像素 '+((e.high_excluded_pixels||0)/Math.max(1,e.area||r.area)*100).toFixed(1)+'%（淘汰阈值 ≥90%）';
case'covisible_iou_only':return e.intersection!==undefined?'与 '+e.primary_group_id+' 共视 IoU '+(e.intersection/Math.max(1,e.union)).toFixed(3):'作为去重代表保留';
case'full_support_containment':return Array.isArray(e)?e.map(x=>'被 '+x.larger_group_id+' 覆盖 '+(100*x.intersection/x.small_count).toFixed(1)+'%').join('；'):'没有满足原规则的较大包含种子';
case'skip_repair_B':case'pr_filter':return 'P='+(e.p??0).toFixed(3)+'，R='+(e.r??0).toFixed(3)+(e.semantic_exemption?'；'+e.semantic_exemption.class_name+' 豁免本步':h.stage==='skip_repair_B'?'；P、R 均 ≥0.90 时无需修复':'；P>0.10 且 R<0.20 时淘汰');
case'preflight':return '投影支持 '+e.projected_seed_points+' 点';
case'abc':return !h.kept?'存在合格 B/C 组合，仅删除当前 A':r.semantic&&['windowpane','blind'].includes(r.semantic.top_class)?'窗户保护：保留':'没有命中删除当前 A 的合格证据';
}return ''}
function show(r){selected=r;$('detail').hidden=false;$('title').textContent=r.scene+' · '+r.track+' · '+(r.final?'最终种子':names[r.terminal]+'未进入下一步');$('large').src=r.image;$('meta').textContent='帧 '+r.frame+' · Mask '+r.mask_local_id+' · 面积 '+r.area.toLocaleString()+' 像素 · 筛选支持 '+r.filter_support.toLocaleString()+' 点';$('cluster').href=r.cluster;$('history').replaceChildren();
for(const [id,name] of data.stages){let h=r.history.find(x=>x.stage===id),tr=document.createElement('tr');let a=document.createElement('td'),b=document.createElement('td');a.textContent=name;b.textContent=h?(h.kept?'保留 · ':'未保留 · ')+evidence(r,h):'未进入';b.className=h?(h.kept?'pass':'fail'):'';tr.append(a,b);$('history').append(tr)}$('abcEvidence').replaceChildren();let abc=r.history.find(h=>h.stage==='abc'&&!h.kept);if(abc&&abc.evidence?.witnesses?.length){let w=abc.evidence.witnesses[0],a=w.metric.areas,box=document.createElement('div');box.style.cssText='margin:12px 0;font-size:12px;line-height:1.7';let title=document.createElement('b');title.textContent='ABC 对应证据';let info=document.createElement('p');info.textContent='比较帧 '+w.target_frame+'：双向覆盖 '+(100*a.covered_A/a.A).toFixed(1)+'% / '+(100*a.covered_A/a.union_BC).toFixed(1)+'%，B/C 重叠 '+(100*a.intersection_BC/Math.min(a.B,a.C)).toFixed(1)+'%。';let views=document.createElement('div');views.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:8px';for(let key of ['B','C']){let row=data.rows.find(x=>x.scene===r.scene&&x.id===w[key]);if(!row)continue;let f=document.createElement('div'),im=document.createElement('img'),cap=document.createElement('div');im.src=row.image;im.alt=key+' 原始 Mask';im.style.cssText='width:100%;height:130px;object-fit:contain;background:#eef2f4';cap.textContent=key+' · '+row.track+' · 来源帧 '+row.frame;f.append(im,cap);views.append(f)}box.append(title,info,views);$('abcEvidence').append(box)}$('raw').textContent=JSON.stringify(r.history,null,2);for(const b of document.querySelectorAll('.card'))b.classList.toggle('selected',b.dataset.id===r.id);history.replaceState(null,'','#scene='+r.scene+'&stage='+stage+'&mask='+r.id+'&view='+(removed?'removed':'kept'))}

function showOriginal(r){selected=r;$('detail').hidden=false;$('title').textContent=r.scene+' · 原本 '+r.id+' · '+r.group;$('large').src=r.image;$('meta').textContent='来源帧 '+r.frame+' · '+r.model+' · '+r.semantic+' · '+r.area.toLocaleString()+' 像素 · '+r.support.toLocaleString()+' 支持点';$('cluster').hidden=true;$('abcEvidence').replaceChildren();$('history').replaceChildren();for(const [a,b] of [['来源','全深度 main · 原本最终修复种子'],['筛选状态','已通过原流程最终 ABC'],['原编号',r.group+' / '+r.id],['原辅助 Mask',r.auxiliary_ids.length?r.auxiliary_ids.join('、'):'无'],['同实例分组','已完成，见顶部“两批同实例分组”']]){let tr=document.createElement('tr');for(const text of [a,b]){let td=document.createElement('td');td.textContent=text;tr.append(td)}$('history').append(tr)}$('raw').textContent=JSON.stringify(r.provenance,null,2);for(const b of document.querySelectorAll('.card'))b.classList.toggle('selected',b.dataset.id===r.id);history.replaceState(null,'','#source=original&scene='+r.scene+'&mask='+r.id)}
function renderOriginal(){const scene=$('scene').value,q=$('search').value.trim().toUpperCase(),rows=data.original.rows.filter(r=>r.scene===scene&&(!q||r.id.includes(q)||r.group.includes(q)||String(r.frame)===q));$('total').textContent='原本 '+data.original.scenes[scene]+' 个 · 本次 '+data.scenes[scene].final+' 个';$('count').textContent='原本最终修复种子 · '+rows.length+' 张';$('grid').replaceChildren();for(const r of rows){let b=document.createElement('button');b.className='card';b.dataset.id=r.id;let im=document.createElement('img');im.src=r.thumb;im.loading='lazy';im.alt='原本 '+r.id+' 种子 Mask';let cap=document.createElement('div');cap.className='caption';let strong=document.createElement('strong');strong.textContent=r.id+' · 帧 '+r.frame;cap.append(strong,document.createTextNode(r.group+' · '+r.semantic+' · 原本最终保留'));b.append(im,cap);b.onclick=()=>showOriginal(r);$('grid').append(b)}if(rows.length)showOriginal(rows.find(r=>selected&&selected.source==='original'&&r.id===selected.id&&r.scene===selected.scene)||rows[0]);else{$('detail').hidden=true;$('grid').textContent='没有匹配的原本种子'}}

function render(){const original=$('source').value==='original';for(const id of ['steps','stageSelect','kept','removed'])$(id).hidden=original;$('cluster').hidden=false;$('note').textContent=original?'原全深度 main 最终 ABC 后留存的修复主种子。保留原编号与来源帧，两批同实例分组可从顶部入口查看。':'每个稳定簇取支持点数最多的一张原始 Mask；并列取较早帧。先选后筛，淘汰不补选。下列数量为每一步剩余的主种子。';if(original)return renderOriginal();let scene=$('scene').value,s=data.scenes[scene],ss=s.stages.find(x=>x.id===stage);$('total').textContent=s.chosen+' 张候选 → '+s.final+' 个最终种子';$('steps').replaceChildren();
for(const st of s.stages){let b=document.createElement('button');b.className='step'+(st.id===stage?' active':'');b.innerHTML='<span>'+st.name+'</span><b>'+st.retained+'</b><small>本步减少 '+st.removed+'</small>';b.onclick=()=>{stage=st.id;render()};$('steps').append(b)}$('stageSelect').replaceChildren();for(const st of s.stages){$('stageSelect').add(new Option(st.name+' · 剩余 '+st.retained,st.id))}$('stageSelect').value=stage;
$('kept').classList.toggle('active',!removed);$('removed').classList.toggle('active',removed);let ids=new Set(removed?ss.removed_ids:ss.retained_ids),q=$('search').value.trim().toUpperCase();let rows=data.rows.filter(r=>r.scene===scene&&ids.has(r.id)&&(!q||r.track.includes(q)||r.id.includes(q)||String(r.frame)===q));$('count').textContent=ss.name+' · '+(removed?'本步淘汰 ':'本步保留 ')+rows.length+' 张';$('grid').replaceChildren();for(const r of rows){let b=document.createElement('button');b.className='card';b.dataset.id=r.id;let im=document.createElement('img');im.src=r.image+'&thumb=1';im.loading='lazy';im.alt=r.track+' 所选 Mask';let cap=document.createElement('div');cap.className='caption';let strong=document.createElement('strong');strong.textContent=r.track+' · 帧 '+r.frame;cap.append(strong,document.createTextNode((r.semantic?r.semantic.top_class+' · ':'')+(r.final?'最终保留':'终止于 '+names[r.terminal])));b.append(im,cap);b.onclick=()=>show(r);$('grid').append(b)}
if(rows.length)show(rows.find(r=>selected&&selected.id===r.id&&selected.scene===r.scene)||rows[0]);else{$('detail').hidden=true;let e=document.createElement('div');e.className='empty';e.textContent=removed?'本步没有淘汰':'本步没有保留';$('grid').append(e)}}
$('source').onchange=()=>{selected=null;$('search').value='';render()};$('stageSelect').onchange=()=>{stage=$('stageSelect').value;render()};$('scene').onchange=()=>{selected=null;render()};$('kept').onclick=()=>{removed=false;render()};$('removed').onclick=()=>{removed=true;render()};$('search').oninput=render;
fetch('data.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(async d=>{const originalResponse=await fetch('original.json');if(!originalResponse.ok)throw Error(originalResponse.status);data=d;data.original=await originalResponse.json();for(const [k,v] of d.stages)names[k]=v;names.final='最终保留';const h=new URLSearchParams(location.hash.slice(1));if(h.get('source')==='original')$('source').value='original';if(d.scenes[h.get('scene')])$('scene').value=h.get('scene');if(names[h.get('stage')])stage=h.get('stage');removed=h.get('view')==='removed';selected=($('source').value==='original'?data.original.rows:d.rows).find(r=>r.scene===$('scene').value&&r.id===h.get('mask'));render()}).catch(e=>$('error').textContent='加载失败：'+e.message)
</script></html>
