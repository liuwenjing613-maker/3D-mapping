<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Replica · 完整分簇检查</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px "Segoe UI","Microsoft YaHei",sans-serif;background:#eef2f4;color:#20313a}button,select,input{font:inherit;padding:7px 9px;border:1px solid #cbd7dc;border-radius:6px;background:white;color:inherit}button,select{cursor:pointer}button:hover{border-color:#147d77}button.active{background:#146c67;color:white}button:disabled{opacity:.4;cursor:default}header{padding:12px 18px;background:white;border-bottom:1px solid #d3dfe2;display:flex;align-items:center;gap:15px;flex-wrap:wrap}h1{font-size:18px;margin:0}small,.muted{color:#617580;font-size:12px}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);height:calc(100vh - 65px)}aside{background:white;border-right:1px solid #d4dfe3;display:flex;flex-direction:column;min-height:0;padding:10px;gap:8px}.filters{display:grid;gap:7px}.filters input,.filters select{width:100%;min-width:0}#items{overflow:auto;flex:1}.card{display:flex;width:100%;gap:8px;margin-bottom:6px;text-align:left;align-items:center;padding:5px}.card img{width:76px;height:53px;object-fit:contain;background:#e9eff1;border-radius:3px}.card span{font-size:12px;line-height:1.7}.card.selected{border:2px solid #19766f;background:#edf8f6;color:#20313a}.pager{display:flex;align-items:center;justify-content:space-between;font-size:12px}main{padding:12px 16px;min-width:0;overflow:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;flex-wrap:wrap}h2{font-size:16px;margin:0}.controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.panels{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px}.panel{background:white;border:1px solid #d5e0e4;border-radius:9px;overflow:hidden}.head{padding:9px 10px;border-bottom:1px solid #e3eaed;display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px}.head button{font-size:12px;padding:5px 7px}.cloudwrap{position:relative;height:clamp(340px,61vh,690px);background:#17242e}canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}.load{position:absolute;inset:0;display:grid;place-items:center;color:white;pointer-events:none}.load[hidden]{display:none}.foot{font-size:12px;color:#607780;padding:8px 10px;line-height:1.7}.images{display:grid;grid-template-columns:1fr;gap:8px;padding:8px}.images figure{margin:0}.images img{display:block;width:100%;height:clamp(125px,24vh,270px);object-fit:contain;background:#eef2f3;cursor:zoom-in}figcaption{padding:5px 0;font-size:12px;color:#516975}.timeline{padding:8px 10px;border-top:1px solid #e3eaed;display:grid;gap:7px}#frame{min-width:0;max-width:100%;flex:1}#slider{padding:0;width:100%;accent-color:#16756e}.note{margin:8px 0;font-size:12px;color:#586f79;line-height:1.7}#match{line-height:1.7;font-size:12px}a{color:#146c67}#modal{position:fixed;inset:0;background:#07131bf2;z-index:5;padding:48px 15px 15px;display:flex;justify-content:center;align-items:center}#modal[hidden]{display:none}#modal img{max-width:100%;max-height:100%;object-fit:contain}#close{position:absolute;right:20px;top:12px}label{font-size:12px;display:flex;align-items:center;gap:3px}input[type=checkbox]{accent-color:#16756e}#error{color:#b43d2f}
@media(max-width:1050px){.layout{grid-template-columns:205px minmax(0,1fr)}.panels{grid-template-columns:1fr}.cloudwrap{height:38vh;min-height:250px}.images{grid-template-columns:1fr 1fr}.images img{height:22vh}.head{flex-wrap:wrap}main{padding:10px}.card img{width:58px}}
@media(max-width:600px){header{padding:9px 10px;gap:6px}header small{display:block;font-size:11px}.layout{grid-template-columns:140px minmax(0,1fr);height:calc(100vh - 50px)}aside{padding:6px}.card{flex-direction:column;align-items:stretch;gap:2px}.card img{width:100%;height:62px}.card span{font-size:11px}.pager button{padding:5px}.panels{gap:8px}.images{grid-template-columns:1fr 1fr}.images img{height:120px}.cloudwrap{height:220px}.head .controls{gap:3px}h2{font-size:14px}.top button{padding:5px}main{padding:8px}}
</style>
<header><h1>完整分簇检查</h1><small>跨帧 Mask 簇 · 非最终实例地图</small><a href="/seeds/" style="font-size:12px">种子筛选过程</a></header>
<div class="layout"><aside><div class="filters"><select id="scene" aria-label="场景"><option>room0</option><option>office2</option></select><select id="status" aria-label="簇状态"><option value="clusters">全部簇</option><option value="STABLE">稳定簇</option><option value="PROVISIONAL">暂定簇</option><option value="pending">未归簇观测</option></select><input id="search" aria-label="搜索簇编号" placeholder="搜索簇编号 / 帧号"></div><small id="summary"></small><div id="items"></div><div class="pager"><button id="pagePrev" aria-label="上一页簇">‹</button><span id="pageCount"></span><button id="pageNext" aria-label="下一页簇">›</button></div></aside>
<main><div class="top"><h2 id="title">加载中…</h2><div class="controls"><button id="prev">上一簇</button><button id="next">下一簇</button></div></div><div id="stats" class="note"></div><div id="error"></div>
<div class="panels"><section class="panel"><div class="head"><b id="cloudTitle">该簇累计点云</b><div class="controls"><button id="union" class="active">累计</button><button id="member">当前帧</button><button id="reset">复位</button></div></div><div class="cloudwrap"><canvas id="cloud" tabindex="0" aria-label="簇点云，拖动旋转、滚轮缩放"></canvas><div id="loading" class="load">加载点云…</div></div><div class="foot"><div class="controls"><label><input type="checkbox" id="context">场景背景</label><label><input type="checkbox" id="allpoints">不抽样</label><span id="pointStats"></span></div>拖动旋转 · 滚轮缩放</div></section>
<section class="panel"><div class="head"><b id="maskTitle">归入此簇的原始 Mask</b><div class="controls"><label><input id="crop" type="checkbox" checked>局部放大</label><label><input id="overlay" type="checkbox" checked>显示 Mask</label></div></div><div class="images"><figure><img id="anchorImg" alt="首次建簇 Mask"><figcaption id="anchorCap"></figcaption></figure><figure><img id="memberImg" alt="当前成员 Mask"><figcaption id="memberCap"></figcaption></figure></div><div class="timeline"><div class="controls"><button id="framePrev" aria-label="上一帧">‹</button><select id="frame" aria-label="成员帧"></select><button id="frameNext" aria-label="下一帧">›</button></div><input type="range" min="0" max="0" value="0" id="slider" aria-label="浏览全部成员帧"><div id="match"></div></div></section></div>
<p class="note" id="definition">累计点云 = 此簇全部已归入 Mask 的三维支持并集。稳定仅表示满足跟踪条件，不代表合并正确或点云干净；不同簇可重叠。</p>
</main></div><div id="modal" hidden role="dialog" aria-label="原始 Mask 放大图"><button id="close">关闭 ×</button><img id="large" alt="Mask 放大图"></div>
<script>
'use strict';const $=x=>document.getElementById(x),labels={STABLE:'稳定簇',PROVISIONAL:'暂定簇',DEFERRED_AMBIGUOUS:'未归簇：匹配歧义',DEFERRED_INSUFFICIENT_SUPPORT:'未归簇：支持不足'};
let data,filtered=[],page=0,current=null,detail=null,member=0,kind='union',selection=0,cloudSerial=0,points=null,count=0,yaw=0,pitch=0,zoom=1,center=[0,0,0],extent=[2,2],drag=null,dirty=false;
const canvas=$('cloud'),gl=canvas.getContext('webgl',{antialias:true,preserveDrawingBuffer:true});let program,buffer;
function sh(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
if(gl){program=gl.createProgram();gl.attachShader(program,sh(gl.VERTEX_SHADER,'attribute vec4 point;uniform vec3 center;uniform vec3 view;uniform float aspect;uniform float size;varying float hit;void main(){vec3 p=point.xyz-center;float cy=cos(view.x),sy=sin(view.x),cp=cos(view.y),sp=sin(view.y);float x=cy*p.x+sy*p.z;float z=-sy*p.x+cy*p.z;float y=cp*p.y-sp*z;z=sp*p.y+cp*z;gl_Position=vec4(x*view.z/max(1.0,aspect),-y*view.z*min(1.0,aspect),z*.05,1.0);gl_PointSize=point.w<.5?size*.65:size;hit=point.w;}'));
gl.attachShader(program,sh(gl.FRAGMENT_SHADER,'precision mediump float;uniform vec3 color;varying float hit;void main(){vec2 d=gl_PointCoord-vec2(.5);if(dot(d,d)>.25)discard;gl_FragColor=vec4(hit<.5?vec3(.24,.30,.34):color,1.0);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);let p=gl.getAttribLocation(program,'point');gl.enableVertexAttribArray(p);gl.vertexAttribPointer(p,4,gl.FLOAT,false,16,0);gl.enable(gl.DEPTH_TEST);gl.clearColor(.09,.14,.18,1);}
function draw(){dirty=false;if(!gl)return;const d=Math.min(devicePixelRatio||1,2),w=Math.round(canvas.clientWidth*d),h=Math.round(canvas.clientHeight*d);if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}gl.viewport(0,0,w,h);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(!count||!current)return;gl.uniform3f(gl.getUniformLocation(program,'view'),yaw,pitch,Math.min(Math.max(1,w/h)*1.65/extent[0],1.65/(Math.min(1,w/h)*extent[1]))*zoom);gl.uniform3fv(gl.getUniformLocation(program,'center'),center);gl.uniform1f(gl.getUniformLocation(program,'aspect'),w/h);gl.uniform1f(gl.getUniformLocation(program,'size'),Math.max(2,d*1.5));gl.uniform3fv(gl.getUniformLocation(program,'color'),current.color.map(x=>x/255));gl.drawArrays(gl.POINTS,0,count)}
function redraw(){if(!dirty){dirty=true;requestAnimationFrame(draw)}}new ResizeObserver(redraw).observe(canvas);
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.008;pitch+=(e.clientY-drag[1])*.008;drag=[e.clientX,e.clientY];redraw()}};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.12,Math.min(15,zoom*Math.exp(-e.deltaY*.001)));redraw()},{passive:false});
function fit(){if(!points)return;const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];for(let n=0;n<points.length;n+=4){if(points[n+3]<.5)continue;for(let j=0;j<3;j++){lo[j]=Math.min(lo[j],points[n+j]);hi[j]=Math.max(hi[j],points[n+j])}}if(!isFinite(lo[0])){center=[0,0,0];extent=[2,2];return}center=lo.map((x,j)=>(x+hi[j])/2);extent=[Math.max(.025,hi[0]-lo[0]),Math.max(.025,hi[1]-lo[1])]}
function api(type,item=current,j=member,extra={}){return '/cluster-api/'+type+'?'+new URLSearchParams({scene:item.scene,id:item.id,member:j,...extra})}
function imgurl(item,j,thumb=false){return api('image',item,j,{crop:thumb||$('crop').checked?'1':'0',overlay:$('overlay').checked?'1':'0',thumb:thumb?'1':'0'})}
async function get(url){let r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);return r}
function statusMatch(x){const s=$('status').value;return s==='clusters'?x.id.startsWith('T'):s==='pending'?x.id.startsWith('U'):x.status===s}
function filter(choose=true){const query=$('search').value.trim().toUpperCase();filtered=data.items.filter(x=>x.scene===$('scene').value&&statusMatch(x)&&(!query||x.id.includes(query)||String(x.first)===query));page=0;renderList();if(choose&&filtered.length)select(filtered[0]);}
function renderList(){let s=data.scenes[$('scene').value];$('summary').textContent=s.tracks+' 簇（稳定 '+s.stable+' / 暂定 '+s.provisional+'）· 未归簇 '+s.pending+' 条';$('items').replaceChildren();filtered.slice(page*40,(page+1)*40).forEach(x=>{let b=document.createElement('button');b.className='card'+(current&&x.id===current.id&&x.scene===current.scene?' selected':'');b.setAttribute('aria-label',x.id+' '+labels[x.status]);let im=document.createElement('img');im.loading='lazy';im.src=imgurl(x,0,true);im.alt='';let sp=document.createElement('span');sp.textContent=x.id+' · '+labels[x.status];let br=document.createElement('br');sp.append(br,document.createTextNode(x.frames+' 帧 · '+x.points.toLocaleString()+' 点'));b.append(im,sp);b.onclick=()=>select(x);$('items').append(b)});$('pageCount').textContent=filtered.length?(page+1)+' / '+Math.ceil(filtered.length/40)+' 页 · '+filtered.length:'无结果';$('pagePrev').disabled=page===0;$('pageNext').disabled=(page+1)*40>=filtered.length;nav();}
function nav(){let i=current?filtered.findIndex(x=>x.id===current.id&&x.scene===current.scene):-1;$('prev').disabled=i<=0;$('next').disabled=i<0||i>=filtered.length-1}
async function select(x){let token=++selection;++cloudSerial;current=x;detail=null;count=0;points=null;member=0;kind='union';yaw=pitch=0;zoom=1;$('pointStats').textContent='';$('maskTitle').textContent=x.id.startsWith('U')?'未归簇的原始 Mask':'归入此簇的原始 Mask';$('error').textContent='';$('title').textContent=x.scene+' · '+x.id+' · '+labels[x.status];$('stats').textContent=x.frames+' 帧 / '+x.views+' 个视角组 · 累计 '+x.points.toLocaleString()+' 点';$('anchorImg').removeAttribute('src');$('memberImg').removeAttribute('src');$('frame').replaceChildren();$('match').textContent='';$('loading').hidden=false;$('loading').textContent='加载点云…';history.replaceState(null,'','#scene='+x.scene+'&track='+x.id);renderList();document.querySelector('.card.selected')?.scrollIntoView({block:'nearest'});redraw();try{let d=await(await get(x.scene+'/'+x.id+'.json')).json();if(token!==selection)return;detail=d;d.members.forEach((m,i)=>{let o=new Option((i+1)+' / '+d.members.length+' · 帧 '+m.frame_id+' · Mask '+m.mask_local_id,i);$('frame').add(o)});$('slider').max=d.members.length-1;showMember(d.members.reduce((best,m,i)=>m.surface_support_count>d.members[best].surface_support_count?i:best,0));await loadCloud(true)}catch(e){if(token===selection){$('error').textContent='加载失败：'+e.message;$('loading').textContent='加载失败'}}}
function showMember(j){if(!detail)return;member=j;$('frame').value=j;$('slider').value=j;let a=detail.members[0],m=detail.members[j];$('anchorImg').src=imgurl(current,0);$('memberImg').src=imgurl(current,j);$('anchorCap').textContent=(current.id.startsWith('U')?'原始观测':'首次建簇')+' · 帧 '+a.frame_id+' · Mask '+a.mask_local_id;$('memberCap').textContent='当前成员 '+(j+1)+' / '+detail.members.length+' · 帧 '+m.frame_id+' · Mask '+m.mask_local_id;$('framePrev').disabled=j===0;$('frameNext').disabled=j===detail.members.length-1;let e=m.fixed_representative_evidence;$('match').textContent=e?'与首次 Mask 共视 IoU '+e.covisible_iou.toFixed(3)+' · 共视覆盖当前支持 '+(100*e.common_fraction_b).toFixed(1)+'%':current.id.startsWith('U')?(detail.matched_tracks.length?'同时匹配：'+detail.matched_tracks.join('、'):'三维支持不足，未建立簇'):'首次观测（后续成员均与它匹配）';if(kind==='member')loadCloud(false)}
async function loadCloud(refit){if(!detail)return;const token=++cloudSerial,item=current,j=member,mode=kind;$('loading').hidden=false;$('loading').textContent='加载点云…';$('union').classList.toggle('active',kind==='union');$('member').classList.toggle('active',kind==='member');$('cloudTitle').textContent=current.id.startsWith('U')?'该观测的三维支持':kind==='union'?'该簇累计点云':'当前帧 Mask 的三维支持';try{let raw=await(await get(api('cloud',item,j,{kind:mode,limit:$('allpoints').checked?0:150000}))).arrayBuffer();let fg=new Float32Array(raw),bg=new Float32Array(0);if($('context').checked)bg=new Float32Array(await(await get(api('cloud',item,j,{kind:'context'}))).arrayBuffer());if(token!==cloudSerial)return;points=new Float32Array(fg.length+bg.length);points.set(bg);points.set(fg,bg.length);count=points.length/4;if(refit)fit();if(gl){gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,points,gl.STATIC_DRAW)}const total=mode==='union'?item.points:detail.members[j].surface_support_count;$('pointStats').textContent='显示 '+(fg.length/4).toLocaleString()+' / '+total.toLocaleString()+' 点';$('loading').hidden=!!fg.length&&!!gl;$('loading').textContent=gl?'该观测没有三维支持点':'浏览器不支持 WebGL';redraw()}catch(e){if(token===cloudSerial){$('loading').textContent='点云加载失败';$('error').textContent=e.message}}}
$('scene').onchange=$('status').onchange=()=>filter();$('search').oninput=()=>filter(false);$('pagePrev').onclick=()=>{page--;renderList()};$('pageNext').onclick=()=>{page++;renderList()};function step(n){let i=filtered.findIndex(x=>current&&x.id===current.id&&x.scene===current.scene);if(filtered[i+n]){page=Math.floor((i+n)/40);select(filtered[i+n])}}$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('frame').onchange=()=>showMember(Number($('frame').value));$('slider').onchange=()=>showMember(Number($('slider').value));$('framePrev').onclick=()=>showMember(Math.max(0,member-1));$('frameNext').onclick=()=>showMember(Math.min(detail.members.length-1,member+1));$('crop').onchange=$('overlay').onchange=()=>showMember(member);
$('union').onclick=()=>{kind='union';loadCloud(false)};$('member').onclick=()=>{kind='member';loadCloud(false)};$('context').onchange=$('allpoints').onchange=()=>loadCloud(false);$('reset').onclick=()=>{yaw=pitch=0;zoom=1;fit();redraw()};for(let id of ['anchorImg','memberImg'])$(id).onclick=()=>{$('large').src=$(id).src;$('modal').hidden=false};$('close').onclick=()=>{$('modal').hidden=true};document.onkeydown=e=>{if(e.key==='Escape')$('modal').hidden=true};
window.addEventListener('hashchange',()=>{if(!data)return;const h=new URLSearchParams(location.hash.slice(1));const x=data.items.find(x=>x.scene===h.get('scene')&&x.id===h.get('track'));if(!x)return;$('scene').value=x.scene;$('status').value=x.id.startsWith('U')?'pending':'clusters';$('search').value='';filter(false);page=Math.floor(filtered.indexOf(x)/40);select(x)});
get('catalog.json').then(r=>r.json()).then(d=>{data=d;let h=new URLSearchParams(location.hash.slice(1)),s=h.get('scene')||'room0',t=h.get('track');$('scene').value=s;let x=d.items.find(x=>x.scene===s&&x.id===t);if(x&&x.id.startsWith('U'))$('status').value='pending';filter(false);x=x||filtered[0];page=Math.max(0,Math.floor(filtered.indexOf(x)/40));select(x)}).catch(e=>{$('error').textContent='目录加载失败：'+e.message});
</script></html>
