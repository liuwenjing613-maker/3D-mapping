<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Replica · 两批最终种子</title><style>
*{box-sizing:border-box}body{margin:0;background:#eff3f4;color:#21343e;font:14px "Segoe UI","Microsoft YaHei",sans-serif}header{padding:14px;background:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:18px;margin:0}select,button{font:inherit;padding:8px;border:1px solid #cbd9dc;border-radius:6px;background:white;color:inherit;cursor:pointer}a{color:#126f68}main{padding:14px;max-width:1600px;margin:auto}#summary{margin-bottom:12px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:16px}h2{font-size:16px;margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;max-height:72vh;overflow:auto;align-content:start}.card{padding:0;overflow:hidden;text-align:left;height:210px}.card img{height:145px;width:100%;object-fit:contain;background:#e5ecef}.caption{font-size:12px;padding:7px;line-height:1.6}.caption b{display:block}dialog{max-width:95vw;width:1000px;border:1px solid #bacbd0;border-radius:10px}dialog img{width:100%;max-height:75vh;object-fit:contain}dialog button{float:right}.pending{padding:25px;background:white;color:#617580}.error{color:#ae392a}@media(max-width:600px){.columns{grid-template-columns:1fr}.grid{max-height:45vh;grid-template-columns:repeat(2,minmax(0,1fr))}.card{height:190px}.card img{height:125px}}
</style><header><h1>Replica · 两批最终种子</h1><select id="scene" aria-label="场景"></select><a id="grouped" href="grouped.html">查看同实例分组</a><button id="reload">刷新结果</button><a href="containment.html">查看待确认包含链</a></header><main><div id="summary"></div><div class="columns"><section><h2 id="oldTitle">原流程最终种子</h2><div class="grid" id="old"></div></section><section><h2 id="newTitle">稳定簇筛选后的最终种子</h2><div class="grid" id="new"></div></section></div><div id="error" class="error"></div></main><dialog id="zoom"><button id="close">关闭</button><h2 id="caption"></h2><img id="large" alt="最终种子 Mask 大图"></dialog><script>
const $=id=>document.getElementById(id);let old,current;
function cards(target,rows,isOld){$(target).replaceChildren();for(const r of rows){let b=document.createElement('button');b.className='card';let im=document.createElement('img');im.src=r.image;im.loading='lazy';im.alt=(isOld?'原本 ':'本次 ')+(r.track||r.id);let cap=document.createElement('div');cap.className='caption';let title=document.createElement('b');title.textContent=(r.track||r.id)+' · 帧 '+r.frame;let sem=isOld?r.semantic:r.semantic.top_class;cap.append(title,document.createTextNode(sem+' · '+r.support.toLocaleString()+' 点'));b.append(im,cap);b.onclick=()=>{$('large').src=r.image;$('caption').textContent=(isOld?'原本 ':'本次 ')+(r.track||r.id)+' · 帧 '+r.frame;$('zoom').showModal()};$(target).append(b)}}
function render(){const s=$('scene').value,a=old.rows.filter(r=>r.scene===s),b=current.rows.filter(r=>r.scene===s),ready=!!current.scenes[s];$('summary').textContent=s+' · 原本 '+a.length+' 张 · 本次 '+(ready?b.length+' 张':current.scene_status[s]);$('oldTitle').textContent='原流程最终种子 · '+a.length+' 张';$('newTitle').textContent='稳定簇筛选后的最终种子 · '+(ready?b.length+' 张':current.scene_status[s]);cards('old',a,true);cards('new',b,false);if(!ready){let p=document.createElement('div');p.className='pending';p.textContent=current.scene_status[s].startsWith('待确认')?'链式包含需要确认处理规则，尚未产生最终种子。':'正在处理；完成完整筛选后显示最终 Mask。';$('new').append(p)}$('grouped').hidden=!ready;$('grouped').href='grouped.html#scene='+s+'&filter=all';history.replaceState(null,'','#scene='+s)}
async function load(){try{const results=await Promise.all(['original.json','data.json'].map(async u=>{const r=await fetch(u);if(!r.ok)throw Error(r.status);return r.json()}));[old,current]=results;const selected=$('scene').value||new URLSearchParams(location.hash.slice(1)).get('scene')||'room1';$('scene').replaceChildren();for(const s of Object.keys(old.scenes))$('scene').add(new Option(s,s));if(old.scenes[selected]!==undefined)$('scene').value=selected;render()}catch(e){$('error').textContent=e.message}}
$('scene').onchange=render;$('reload').onclick=load;$('close').onclick=()=>$('zoom').close();load();
</script></html>
