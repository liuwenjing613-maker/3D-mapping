  <script>
  (() => {
    const root=document.getElementById('p1a1-room0-roi-review');
    const q=id=>root.querySelector('#'+id);
    const records=JSON.parse(q('roi-data').textContent);
    const choice=q('roi-choice'),mode=q('roi-cloud-mode'),view=q('roi-cloud-view');
    const canvas=q('roi-cloud'),ctx=canvas.getContext('2d');
    let current=records[0],points=[],yaw=-.55,pitch=1.0,drag=null;
    for(const r of records){const o=document.createElement('option');o.value=String(r.rank);o.textContent=`${r.id} · ${r.place}`;choice.appendChild(o);}
    function decode(r){
      const b=Uint8Array.from(atob(r.cloud),c=>c.charCodeAt(0));const d=new DataView(b.buffer);const result=[];
      for(let i=0;i<r.cloud_count;i++){const j=i*13;result.push({p:[d.getInt16(j,true)/1000,d.getInt16(j+2,true)/1000,d.getInt16(j+4,true)/1000],rgb:[b[j+6],b[j+7],b[j+8]],state:[b[j+9],b[j+10],b[j+11]],role:b[j+12]});}
      return result;
    }
    function rotate(p){const cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);const x=cy*p[0]-sy*p[1],y=sy*p[0]+cy*p[1];return [x,cp*y+sp*p[2],-sp*y+cp*p[2]];}
    function draw(){
      const w=canvas.clientWidth,h=canvas.clientHeight,dpr=window.devicePixelRatio||1;if(!w||!h)return;
      canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
      const projected=points.map(a=>({a,p:rotate(a.p)}));
      const xx=projected.map(a=>a.p[0]),yy=projected.map(a=>a.p[1]);const xmin=Math.min(...xx),xmax=Math.max(...xx),ymin=Math.min(...yy),ymax=Math.max(...yy);
      const scale=Math.min((w-35)/Math.max(.08,xmax-xmin),(h-35)/Math.max(.08,ymax-ymin));const midx=(xmin+xmax)/2,midy=(ymin+ymax)/2;
      projected.sort((a,b)=>a.p[2]-b.p[2]);
      for(const a of projected){const rgb=mode.value==='states'?a.a.state:a.a.rgb;ctx.fillStyle=`rgb(${rgb.join(',')})`;ctx.beginPath();ctx.arc(w/2+(a.p[0]-midx)*scale,h/2-(a.p[1]-midy)*scale,a.a.role===1?2:1.7,0,Math.PI*2);ctx.fill();}
      const foreground=getComputedStyle(root).color;ctx.strokeStyle=foreground;ctx.fillStyle=foreground;ctx.lineWidth=1;ctx.font='12px sans-serif';
      const origin=[w-58,h-40];
      for(const [label,p] of [['X',[.05,0,0]],['Y',[0,.05,0]],['Z',[0,0,.05]]]){const a=rotate(p);const b=[origin[0]+a[0]*480,origin[1]-a[1]*480];ctx.beginPath();ctx.moveTo(...origin);ctx.lineTo(...b);ctx.stroke();ctx.fillText(label,b[0]+2,b[1]-2);}
    }
    function orient(){if(view.value==='top'){yaw=0;pitch=0;}else if(view.value==='front'){const smallest=current.extent.indexOf(Math.min(...current.extent));yaw=smallest===0?Math.PI/2:0;pitch=smallest===2?0:Math.PI/2;}else{yaw=-.55;pitch=1.0;}}
    function save(){if(!window.openai?.setWidgetState)return;window.openai.setWidgetState({modelContent:{method:'P1-A1',scene:'room0',selected_ROI:current.id,global_priority_rank:current.rank,trigger_counts:current.counts,diagnosis:current.diagnosis.type,competing_IDs:current.competition,images_only:true},privateContent:{kind:'p1a1-room0-roi-v1',rank:current.rank,mode:mode.value,view:view.value,yaw,pitch}}).catch(()=>{});}
    function show(rank,remember=true){
      current=records.find(r=>r.rank===Number(rank))||records[0];choice.value=String(current.rank);points=decode(current);orient();
      q('roi-summary').textContent=`${current.id} · 优先分数 ${current.score.toFixed(2)} · U ${current.counts.U} / C ${current.counts.CONFLICT} / T ${current.counts.T} · ROI ${current.context} 点（已分配邻域 ${current.stable} 点）`;
      q('roi-location').src=current.images.location;q('roi-location-label').textContent=`主帧 ${current.frame} · 核心可见 ${current.coverage}%`;
      for(const name of ['states','current3d'])q('roi-'+name).src=current.images[name];
      q('roi-case-type').textContent=current.diagnosis.type;
      q('roi-fact').textContent=current.diagnosis.fact;q('roi-relation').textContent=current.diagnosis.relation;
      q('roi-votes').textContent=current.votes;q('roi-inference').textContent=current.diagnosis.interpretation;
      q('roi-cloud-label').textContent=`${current.extent.map(x=>(x*100).toFixed(1)).join(' × ')} cm · 拖动旋转 · 显示抽样点`;
      q('roi-evidence').textContent=`竞争组合：${current.pair_details}`;
      q('roi-ranges').textContent=current.ranges;
      const aux=q('roi-aux');aux.replaceChildren();for(const a of current.supports){const fig=document.createElement('figure');fig.style.margin='0';const im=document.createElement('img');im.src=a.rgb;im.alt=`实例 ID${a.id} 在帧 ${a.frame}、mask ${a.local_mask} 对同一代表点投票`;const cap=document.createElement('figcaption');cap.className='text-small';cap.textContent=`ID${a.id} · 帧 ${a.frame} · mask ${a.local_mask} · 该ID合计 ${a.votes}票`;fig.append(im,cap);aux.appendChild(fig);}if(!current.supports.length)aux.textContent='没有红点，无双实例竞争来源。';
      const pos=records.indexOf(current);q('roi-prev').disabled=pos===0;q('roi-next').disabled=pos===records.length-1;canvas.setAttribute('aria-label',`${current.id} 的三维抽样点，尺寸 ${current.extent.join(' × ')} 米`);draw();if(remember)save();
    }
    choice.addEventListener('change',()=>show(choice.value));
    q('roi-prev').addEventListener('click',()=>show(records[Math.max(0,records.indexOf(current)-1)].rank));
    q('roi-next').addEventListener('click',()=>show(records[Math.min(records.length-1,records.indexOf(current)+1)].rank));
    mode.addEventListener('change',()=>{draw();save();});view.addEventListener('change',()=>{orient();draw();save();});
    canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);});
    canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-drag.x)*.01;pitch=Math.max(-Math.PI,Math.min(Math.PI,pitch+(e.clientY-drag.y)*.01));drag={x:e.clientX,y:e.clientY};draw();});
    canvas.addEventListener('pointerup',()=>{drag=null;save();});canvas.addEventListener('pointercancel',()=>{drag=null;});
    new ResizeObserver(draw).observe(canvas);new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    function restore(s){const p=s?.privateContent;if(p?.kind!=='p1a1-room0-roi-v1'){show(records[0].rank,false);return;}mode.value=p.mode==='instances'?'instances':'states';view.value=['front','top','oblique'].includes(p.view)?p.view:'oblique';show(p.rank,false);if(Number.isFinite(p.yaw)&&Number.isFinite(p.pitch)){yaw=p.yaw;pitch=p.pitch;draw();}}
    window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});restore(window.openai?.widgetState);
  })();
  </script>
