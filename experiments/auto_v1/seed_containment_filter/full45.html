<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>45 个保留种子 · 原始整图 Mask</title>
<style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;background:#f3f5f3;color:#243c34}*{box-sizing:border-box}body{margin:0}main{max-width:1680px;margin:auto;padding:28px}h1{font-size:28px;margin:8px 0 14px}.eyebrow{font-size:12px;letter-spacing:1px;color:#5e796e}p{line-height:1.7;color:#61766c}.info{padding:14px 18px;border-left:4px solid #4c8b70;background:#e6eee8}.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:22px 0;position:sticky;top:0;background:#f3f5f3ee;padding:12px 0;z-index:2}input,select,button{font:inherit;padding:9px 12px;background:white;border:1px solid #ccd9d0;border-radius:7px}button{cursor:pointer;color:#335e4c}.count{font-size:14px;color:#607567}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.grid.single{grid-template-columns:1fr}article{background:white;border:1px solid #d7e2da;border-radius:12px;overflow:hidden}article header{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}article h2{font-size:20px;margin:0}small{font-size:12px;color:#7a8c82}.image{border:0;padding:0;display:block;width:100%;background:#17241e;border-radius:0;cursor:zoom-in}.image img{display:block;width:100%;height:auto;aspect-ratio:1200/680;object-fit:contain}article footer{padding:12px 18px;font-size:12px;display:flex;justify-content:space-between;color:#6e8177}a{color:#277253}.empty{padding:40px;grid-column:1/-1;text-align:center}dialog{padding:0;border:0;border-radius:12px;max-width:98vw;width:1450px;max-height:96vh;background:#fafcf9;color:#294337}dialog::backdrop{background:#14231de8}dialog header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:10px}dialog h2{font-size:19px;margin:0}dialog img{width:100%;height:auto;display:block}dialog footer{padding:12px 20px;color:#6c8074;font-size:13px}.controls{display:flex;gap:8px}@media(max-width:850px){main{padding:18px}.grid{grid-template-columns:1fr}h1{font-size:24px}dialog header{flex-wrap:wrap}article header{padding:12px 15px}}
</style></head><body><main><div class="eyebrow">AUTO-V1 · ROOM2 · B 后保留的 45 个种子</div><h1>原始整图 Mask</h1><p>每张图都显示完整来源帧，绿色区域为该种子的原始 Mask。点击图片可放大，放大后用左右方向键逐个查看。</p><div class="info">范围固定为 B 筛选后保留的 45 个种子，尚未应用本轮 70% 包含率筛选。原 Mask 像素不变，图片不裁剪。</div><div class="bar"><label>搜索 <input id="search" type="search" aria-label="搜索种子" placeholder="G081 / Mask 编号 / 帧号"></label><label>布局 <select id="layout" aria-label="整图布局"><option value="double">并排整图</option><option value="single">单列大图</option></select></label><span id="count" class="count"></span><a href="../room2_seed_skip_repair_B_20261019/index.html?decision=retain&view=gallery">返回 B 的判断结果</a></div><section id="grid" class="grid" aria-label="45 个原始整图 Mask"></section></main>
<dialog id="viewer" aria-label="整图放大查看"><header><h2 id="viewer-title"></h2><div class="controls"><button id="prev" type="button">上一张</button><button id="next" type="button">下一张</button><button id="close" type="button">关闭</button></div></header><img id="viewer-image" alt=""><footer id="viewer-meta"></footer></dialog>
<script>
const DATA=__SEED_DATA__;
const rows=DATA.records;const $=s=>document.querySelector(s);let filtered=rows,active=rows[0].group_id;
function show(id){active=id;const r=rows.find(x=>x.group_id===id);$('#viewer-title').textContent=`${r.group_id} · ${r.mask_id} · 来源帧 ${r.frame}`;$('#viewer-image').src=r.image;$('#viewer-image').alt=`${r.group_id} 原始整图 Mask`;$('#viewer-meta').textContent=`${rows.indexOf(r)+1} / 45 · 完整来源帧 1200 × 680 · Mask ${r.area.toLocaleString()} 像素 · TSDF ${r.support_count.toLocaleString()} 点`;if(!$('#viewer').open)$('#viewer').showModal();const u=new URL(location.href);u.searchParams.set('group',id);history.replaceState(null,'',u);}
function render(){const q=$('#search').value.trim().toLowerCase();filtered=rows.filter(r=>`${r.group_id} ${r.mask_id} ${r.frame}`.toLowerCase().includes(q));$('#count').textContent=`显示 ${filtered.length} / 45 个`;$('#grid').classList.toggle('single',$('#layout').value==='single');$('#grid').innerHTML=filtered.map(r=>`<article><header><h2>${r.group_id} <small>${r.mask_id}</small></h2><small>来源帧 ${r.frame}</small></header><button class="image" data-group="${r.group_id}" aria-label="放大 ${r.group_id} 原始整图 Mask"><img src="${r.image}" alt="${r.group_id} 原始整图 Mask" loading="lazy" width="1200" height="680"></button><footer><span>Mask ${r.area.toLocaleString()} 像素 · TSDF ${r.support_count.toLocaleString()} 点</span><a href="${r.image}" target="_blank" rel="noopener">打开原尺寸图</a></footer></article>`).join('')||'<p class="empty">没有匹配的种子</p>';$('#grid').querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>show(b.dataset.group));}
function step(d){const list=filtered.length?filtered:rows;const i=list.findIndex(r=>r.group_id===active);show(list[(i+d+list.length)%list.length].group_id);}
$('#search').addEventListener('input',render);$('#layout').addEventListener('change',render);$('#close').onclick=()=>$('#viewer').close();$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);document.addEventListener('keydown',e=>{if(!$('#viewer').open)return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);});render();const requested=new URLSearchParams(location.search).get('group');if(rows.some(r=>r.group_id===requested))show(requested);
</script></body></html>
