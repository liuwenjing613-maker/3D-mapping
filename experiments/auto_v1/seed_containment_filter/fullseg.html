<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>45 个种子来源 · 全部分割 Mask</title><style>
:root{font-family:Inter,"Microsoft YaHei",sans-serif;background:#f3f5f3;color:#243c34}*{box-sizing:border-box}body{margin:0}main{max-width:1680px;margin:auto;padding:28px}h1{font-size:28px;margin:9px 0 14px}.eyebrow{font-size:12px;letter-spacing:1px;color:#628074}p{line-height:1.8;color:#61766c}.info{padding:14px 18px;border-left:4px solid #4c8b70;background:#e6eee8;line-height:1.8;font-size:14px}.bar{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:18px 0;padding:12px 0;background:#f3f5f3}input,select,button{font:inherit;padding:9px 12px;background:white;border:1px solid #ccd9d0;border-radius:7px}button{cursor:pointer;color:#335e4c}.count{font-size:14px;color:#607567}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.grid.single{grid-template-columns:1fr}article{background:white;border:1px solid #d7e2da;border-radius:12px;overflow:hidden}article header{padding:15px 18px}article h2{font-size:20px;margin:0 0 7px}small{font-size:12px;color:#75897d}.image{border:0;padding:0;display:block;width:100%;background:#17241e;border-radius:0;cursor:zoom-in}.image img{display:block;width:100%;height:auto;aspect-ratio:1200/680;object-fit:contain}article footer{padding:12px 18px;font-size:12px;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;color:#6e8177}a{color:#277253}.badge{background:#e5eee8;padding:4px 8px;border-radius:5px;color:#35634b;margin-left:6px;font-size:12px}.empty{padding:40px;grid-column:1/-1;text-align:center}dialog{padding:0;border:0;border-radius:12px;max-width:98vw;width:1450px;max-height:96vh;background:#fafcf9;color:#294337}dialog::backdrop{background:#14231de8}dialog header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;gap:10px;flex-wrap:wrap}dialog h2{font-size:19px;margin:0}dialog img{width:100%;height:auto;display:block}dialog footer{padding:12px 20px;color:#6c8074;font-size:13px;line-height:1.8}.controls{display:flex;gap:8px;flex-wrap:wrap}.note{font-size:12px;color:#75877c;margin-top:24px}@media(max-width:900px){main{padding:18px}.grid{grid-template-columns:1fr}h1{font-size:24px}article header{padding:12px 15px}}
</style></head><body><main><div class="eyebrow">AUTO-V1 · ROOM2 · 45 个种子的原始分割来源</div><h1>完整分割结果 · 全部 Mask</h1><p>展示每个种子来源的那次分割输出中的全部 Mask，包含后来被筛掉的部分。45 个种子对应 34 帧、41 份不同分割输出。</p><div class="info">彩色区域是该次输出的全部标签。裁剪推理结果按原位置放回完整图像，黄色框标出当时的推理范围；框外保留原图。种子编号用于定位来源，不限制显示哪些 Mask。</div><div class="bar"><label>搜索 <input id="search" type="search" aria-label="搜索分割来源" placeholder="G081 / 帧号 / 模型"></label><label>显示 <select id="mode" aria-label="分割显示方式"><option value="overlay">全部 Mask 叠加原图</option><option value="mask">全部 Mask 彩色标签</option><option value="rgb">原始 RGB</option></select></label><label>布局 <select id="layout" aria-label="分割页面布局"><option value="double">并排整图</option><option value="single">单列大图</option></select></label><span id="count" class="count"></span></div><section id="grid" class="grid" aria-label="全部分割结果"></section><p class="note">显示的是当时用于选种子的标签分割输出；SAM 项使用原有互斥标签图。颜色只区分该次输出内的标签，不表示跨帧实例身份。没有重新推理或改变种子选择。</p></main>
<dialog id="viewer" aria-label="完整分割放大查看"><header><h2 id="viewer-title"></h2><div class="controls"><select id="viewer-mode" aria-label="放大图显示方式"><option value="overlay">全部 Mask 叠图</option><option value="seed">仅种子 Mask</option><option value="mask">彩色标签</option><option value="rgb">原始 RGB</option></select><button id="prev">上一张</button><button id="next">下一张</button><button id="close">关闭</button></div></header><img id="viewer-image" alt=""><footer id="viewer-meta"></footer></dialog>
<script>
const DATA=__DATA__;const rows=DATA.records,sources=DATA.sources,$=s=>document.querySelector(s);let filtered=rows,active=rows[0].group_id;
$('#mode').insertAdjacentHTML('beforeend','<option value="seed">仅种子 Mask</option>');
function imageFor(r,mode){return mode==='seed'?r.seed_image:sources[r.source_id].images[mode];}
function setUrl(){const u=new URL(location.href);u.searchParams.set('group',active);u.searchParams.set('mode',$('#viewer').open?$('#viewer-mode').value:$('#mode').value);history.replaceState(null,'',u);}
function drawViewer(){const r=rows.find(x=>x.group_id===active),s=sources[r.source_id],mode=$('#viewer-mode').value,only=mode==='seed';$('#viewer-title').textContent=`${r.group_id} · ${s.model_name} · 帧 ${r.frame} · ${only?'仅种子 Mask #'+r.source_label:mode==='rgb'?'原始 RGB':'全部 '+s.mask_count+' 个 Mask'}`;$('#viewer-image').src=imageFor(r,mode);$('#viewer-image').alt=only?`${r.group_id} 原始种子 Mask`:`${r.group_id} 来源的全部分割 Mask`;$('#viewer-meta').innerHTML=`${only?'仅高亮当前种子的原始 Mask，原图范围完整。':mode==='rgb'?'当前显示原始 RGB。':`该次输出的种子标签为 #${r.source_label}；当前显示全部 ${s.mask_count} 个标签。${s.crop?' 黄色框内为原始推理范围。':' 原始推理范围为整帧。'}`}<br><a href="${imageFor(r,mode)}" target="_blank" rel="noopener">打开当前原尺寸图</a> · <a href="${s.images.labels}" download>下载原始标签 PNG</a>`;}
function show(id){active=id;$('#viewer-mode').value=$('#mode').value;drawViewer();if(!$('#viewer').open)$('#viewer').showModal();setUrl();}
function render(){const q=$('#search').value.trim().toLowerCase(),mode=$('#mode').value,only=mode==='seed';filtered=rows.filter(r=>`${r.group_id} ${r.frame} ${sources[r.source_id].model_name}`.toLowerCase().includes(q));$('#count').textContent=`显示 ${filtered.length} / 45 个种子来源`;$('#grid').classList.toggle('single',$('#layout').value==='single');$('#grid').innerHTML=filtered.map(r=>{const s=sources[r.source_id];return `<article><header><h2>${r.group_id} 来源 <span class="badge">${only?'仅种子 Mask':mode==='rgb'?'原始 RGB':'全部 '+s.mask_count+' 个 Mask'}</span></h2><small>${s.model_name} · 帧 ${r.frame} · 原种子标签 #${r.source_label}${s.crop?' · 裁剪结果放回整图':' · 整帧分割'}</small></header><button class="image" data-group="${r.group_id}" aria-label="放大 ${r.group_id} 分割图"><img src="${imageFor(r,mode)}" alt="${only?r.group_id+' 原始种子 Mask':r.group_id+' 来源的全部分割 Mask'}" loading="lazy" width="1200" height="680"></button><footer><span>${only?'仅高亮原始种子':s.crop?'黄色框标出原始推理范围':'完整原始图像 1200 × 680'}${s.groups.length>1?' · 同一来源输出：'+s.groups.join('、'):''}</span><a href="${imageFor(r,mode)}" target="_blank" rel="noopener">打开原尺寸图</a></footer></article>`}).join('')||'<p class="empty">没有匹配的来源</p>';$('#grid').querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>show(b.dataset.group));}
function step(d){const list=filtered.length?filtered:rows;const i=list.findIndex(r=>r.group_id===active);active=list[(i+d+list.length)%list.length].group_id;drawViewer();setUrl();}
$('#search').addEventListener('input',render);$('#layout').addEventListener('change',render);$('#mode').addEventListener('change',()=>{render();setUrl()});$('#viewer-mode').addEventListener('change',()=>{$('#mode').value=$('#viewer-mode').value;render();drawViewer();setUrl()});$('#close').onclick=()=>$('#viewer').close();$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);document.addEventListener('keydown',e=>{if(!$('#viewer').open)return;if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});const initial=new URLSearchParams(location.search),mode=initial.get('mode');if(['seed','overlay','mask','rgb'].includes(mode))$('#mode').value=mode;render();const q=initial.get('group');if(rows.some(r=>r.group_id===q))show(q);
</script></body></html>
