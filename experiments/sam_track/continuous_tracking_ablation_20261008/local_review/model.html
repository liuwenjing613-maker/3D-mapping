<body><main><h1>连续性截断 · 实际完整3D地图</h1><p><a href="index.html">返回指标与全部轨迹</a> · <a id="maskLink" href="playback.html?scene=room2&policy=gap1">逐帧检查mask</a></p>
<p class="notice">三幅地图共用同一批真实TSDF表面点和同一相机。拖动任一幅，三幅同步旋转；滚轮缩放。灰色表示未分配。显示筛选只影响观看，不改变地图。</p>
<div class="toolbar"><label>场景 <select id="scene"><option value="room0">room0</option><option value="room2" selected>room2</option></select></label><label>范围 <select id="caseSelect"><option value="full">完整场景</option></select></label><label>左侧参考 <select id="reference"><option value="1">原完整追踪修复</option><option value="0">原始P1-A1地图</option></select></label><label>颜色 <select id="colorMode"><option value="0">实例颜色</option><option value="1">相对原完整追踪的变化</option></select></label><label><input id="unknown" type="checkbox" checked>显示灰点</label><label><input id="others" type="checkbox" checked>显示其他实例</label><label><input id="changesOnly" type="checkbox">只看变化点</label><label>点大小 <input id="pointSize" type="range" min="1" max="5" step=".25" value="2"></label><button id="reset">重置视角</button><button id="allIds">目标全部显示</button></div>
<p id="busy">等待完整地图结果…</p><p id="deltaLegend" class="muted" hidden>绿色＝原灰点获得实例；红色＝原有实例变为灰点；橙色＝正实例ID改变；其他点为暗灰色。</p>
<div class="panels"><section class="panel"><h2 id="referenceTitle">原完整追踪修复</h2><canvas id="left" aria-label="原参考3D地图"></canvas><p id="leftStats"></p></section><section class="panel"><h2>严格连续：1帧空就停</h2><canvas id="middle" aria-label="严格连续3D地图"></canvas><p id="middleStats"></p></section><section class="panel"><h2>允许空1帧：连续2帧空就停</h2><canvas id="right" aria-label="允许空1帧3D地图"></canvas><p id="rightStats"></p></section></div>
<p class="muted">下方勾选控制对应实例的可见性。选择ROI后，相同空间范围应用于三幅图；完整地图统计不随显示筛选改变。</p><div id="idLegend" class="legend"></div><p id="downloads"></p><p id="proof" class="muted"></p></main><script type="module" src="comparison_model.js"></script></body></html>
