[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "repair-unified-eval"
version = "2.0.0"
description = "Unified class-agnostic evaluation for 3D instance maps"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
test = ["pytest>=7"]
repair = ["Pillow>=9", "open3d>=0.18"]

[tool.setuptools.packages.find]
include = ["unified_eval*", "instance_repair"]

[tool.setuptools.package-data]
unified_eval = ["configs/*.json"]

instance_repair = ["configs/*.json", "frozen_e1_20261012/*.json", "frozen_e1_20261012/*/*.json", "frozen_e1_20261012/*/*.py", "frozen_e1_20261012/*/dependencies/*.py", "frozen_e1_20261012/*/dependencies/*/*.py"]
